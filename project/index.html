<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekt | Timo Böse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap&subset=latin,latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="../css/project.css?v=6">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="../assets/favicon/site.webmanifest">
  <style>
    /* Password Overlay */
    .password-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(8px);
    }
    .password-box {
      background: #111;
      border: 1px solid #333;
      padding: 3rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .password-box h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 1.4rem;
      color: #fff;
      margin: 0 0 0.5rem 0;
      letter-spacing: 0.05em;
    }
    .password-box p {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: #888;
      margin: 0 0 1.5rem 0;
    }
    .password-box input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .password-box input:focus {
      border-color: #666;
    }
    .password-box .error-msg {
      color: #ff4444;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      min-height: 1.2rem;
    }
    .password-box button {
      margin-top: 1rem;
      padding: 0.7rem 2rem;
      background: #fff;
      color: #000;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .password-box button:hover {
      opacity: 0.8;
    }
    .password-box .btn-back {
      display: inline-block;
      margin-top: 1rem;
      color: #666;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
    }
    .password-box .btn-back:hover {
      color: #fff;
    }
    /* YouTube embed */
    .hero-youtube {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hero-youtube iframe {
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }
    /* Description links */
    .info-text p a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 1px;
      text-decoration-color: #555;
      transition: text-decoration-color 0.2s;
    }
    .info-text p a:hover {
      text-decoration-color: #fff;
    }
  </style>
</head>
<body>
  <svg style="width:0;height:0;position:absolute;">
    <filter id="cloud-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </svg>

  <div class="ui-layer">
    <a href="../index.html#work" class="btn-close" title="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </a>
  </div>

  <div id="project-content"></div>

<script>
/**
 * project-loader.js – inline, kein Cache-Problem
 * v2 – Unterstützt description_en/description_de, YouTube Hero, Links in Texten, Passwort-Schutz
 */
(function () {
  function getProjectId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id") || "";
  }

  function resolveUrl(basePath, path) {
    if (!path) return "";
    if (path.startsWith("http")) return path;
    if (path.startsWith("/")) return path;
    var base = basePath.endsWith("/") ? basePath : basePath + "/";
    var resolved = base + path;
    var parts = resolved.split("/");
    var result = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === "..") { result.pop(); }
      else if (parts[i] !== ".") { result.push(parts[i]); }
    }
    return result.join("/");
  }

  function videoType(src) {
    if (src.endsWith(".webm")) return "video/webm";
    if (src.endsWith(".mp4")) return "video/mp4";
    return "video/mp4";
  }

  function isYouTubeUrl(url) {
    return url && (url.indexOf("youtube.com") !== -1 || url.indexOf("youtu.be") !== -1);
  }

  function getYouTubeEmbedUrl(url) {
    var videoId = "";
    var match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    if (match) videoId = match[1];
    if (!videoId) return "";
    return "https://www.youtube.com/embed/" + videoId + "?autoplay=1&mute=1&loop=1&playlist=" + videoId + "&controls=0&showinfo=0&rel=0&modestbranding=1";
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // Aktuelle Sprache ermitteln
  function getCurrentLang() {
    if (window.i18n && typeof window.i18n.getLang === 'function') {
      return window.i18n.getLang();
    }
    return 'en';
  }

  // Beschreibung je nach Sprache auswählen
  function getDescription(data) {
    var lang = getCurrentLang();
    if (lang === 'de' && Array.isArray(data.description_de)) {
      return data.description_de;
    }
    if (Array.isArray(data.description_en)) {
      return data.description_en;
    }
    // Fallback: alte description (EN)
    if (Array.isArray(data.description)) {
      return data.description;
    }
    return [];
  }

  function buildPage(data, basePath) {
    // Prüfen ob passwortgeschützt
    if (data.passwordProtected) {
      return buildPasswordPage(data, basePath);
    }

    var heroSrc = resolveUrl(basePath, data.heroVideo || "");
    var isYouTube = isYouTubeUrl(heroSrc);
    var heroType = videoType(heroSrc);

    var metaHtml = "";
    if (data.client && data.client !== "Confidential") {
      metaHtml += '<div class="meta-block"><strong>Client</strong> ' + escapeHtml(data.client || "") + '</div>';
    }
    metaHtml += '<div class="meta-block"><strong>Role</strong> ' + escapeHtml(data.role || "") + '</div>';
    if (data.year && data.year !== "-") {
      metaHtml += '<div class="meta-block"><strong>Year</strong> ' + escapeHtml(data.year || "") + '</div>';
    }
    if (data.agency && data.agency !== "-") {
      metaHtml += '<div class="meta-block"><strong>Agency</strong> ' + escapeHtml(data.agency || "") + '</div>';
    }

    // Beschreibung mit Sprachunterstützung
    var description = getDescription(data);
    var descriptionHtml = "";
    if (description.length > 0) {
      description.forEach(function (p) {
        // Erlaubt HTML (für Links), aber escaped sicher
        descriptionHtml += '<p class="anim-text">' + p + "</p>";
      });
    }

    var creditsHtml = "";
    if (Array.isArray(data.credits) && data.credits.length > 0) {
      creditsHtml = '<div class="credits-list anim-text">';
      data.credits.forEach(function (c) {
        creditsHtml +=
          '<div class="credit-item"><span class="credit-role">' +
          escapeHtml(c.role) +
          "</span> " +
          escapeHtml(c.name) +
          "</div>";
      });
      creditsHtml += "</div>";
    }

    var galleryLayout = data.galleryLayout || "horizontal";

    var galleryHtml = "";
    var gallerySectionClass = "horizontal-scroll-container";
    if (Array.isArray(data.gallery)) {
      if (galleryLayout === "grid") {
        gallerySectionClass = "grid-scroll-container";
        galleryHtml = '<div class="grid-gallery">';
        data.gallery.forEach(function (item) {
          var src = resolveUrl(basePath, item.src);
          var caption = escapeHtml(item.caption || "");
          var itemIsYouTube = isYouTubeUrl(src);
          if (item.type === "video" || itemIsYouTube) {
            if (itemIsYouTube) {
              var embedUrl = getYouTubeEmbedUrl(src);
              galleryHtml +=
                '<div class="grid-item grid-item-youtube">' +
                '<div class="youtube-embed-wrapper" style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;max-width:100%;background:#000">' +
                '<iframe src="' + embedUrl + '" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%"></iframe>' +
                '</div>' +
                '<div class="asset-caption">' + caption + "</div></div>";
            } else {
              galleryHtml +=
                '<div class="grid-item">' +
                '<video autoplay muted loop playsinline src="' + src + '" onerror="this.parentElement.classList.add(\'load-error\');console.error(\'Video failed:\',this.src)"></video>' +
                '<div class="asset-caption">' + caption + "</div></div>";
            }
          } else {
            galleryHtml +=
              '<div class="grid-item">' +
              '<img src="' + src + '" alt="' + caption + '" loading="eager" onerror="this.parentElement.classList.add(\'load-error\');console.error(\'Image failed:\',this.src)">' +
              '<div class="asset-caption">' + caption + "</div></div>";
          }
        });
        galleryHtml += "</div>";
      } else {
        // Horizontal-Layout (Standard)
        data.gallery.forEach(function (item) {
          var src = resolveUrl(basePath, item.src);
          var caption = escapeHtml(item.caption || "");
          var styleAttr = item.width ? ' style="width:' + escapeHtml(item.width) + '"' : "";
          var itemIsYouTube = isYouTubeUrl(src);
          if (item.type === "video" || itemIsYouTube) {
            if (itemIsYouTube) {
              var embedUrl = getYouTubeEmbedUrl(src);
              galleryHtml +=
                '<div class="gallery-item gallery-item-youtube"' + styleAttr + '>' +
                '<div class="youtube-embed-wrapper" style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;max-width:100%;background:#000">' +
                '<iframe src="' + embedUrl + '" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%"></iframe>' +
                '</div>' +
                '<div class="asset-caption">' + caption + "</div></div>";
            } else {
              galleryHtml +=
                '<div class="gallery-item"' + styleAttr + '>' +
                '<video autoplay muted loop playsinline src="' + src + '" onerror="this.parentElement.classList.add(\'load-error\');console.error(\'Video failed:\',this.src)">' +
                '</video><div class="asset-caption">' + caption + "</div></div>";
            }
          } else {
            galleryHtml +=
              '<div class="gallery-item"' + styleAttr + '>' +
              '<img src="' + src + '" alt="' + caption + '" loading="eager" onerror="this.parentElement.classList.add(\'load-error\');console.error(\'Image failed:\',this.src)">' +
              '<div class="asset-caption">' + caption + "</div></div>";
          }
        });
      }
    }

    var nav = data.nav || {};
    var prevHref = nav.prevHref || "index.html#work";
    var nextHref = nav.nextHref || "index.html#work";
    var prevTitle = nav.prevTitle || "Overview";
    var nextTitle = nav.nextTitle || "";

    // Hero-Bereich: YouTube oder Video
    var heroHtml = "";
    if (isYouTube) {
      var embedUrl = getYouTubeEmbedUrl(heroSrc);
      heroHtml =
        '<div class="hero-youtube">' +
        '<iframe src="' + embedUrl + '" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>' +
        "</div>";
    } else {
      heroHtml =
        '<div class="video-loader" id="mainLoader"></div>' +
        '<video class="hero-video" id="mainVideo" autoplay muted loop playsinline>' +
        '<source src="' + heroSrc + '" type="' + heroType + '">' +
        "</video>";
    }

    // Video-Controls nur bei lokalem Video
    var controlsHtml = "";
    if (!isYouTube) {
      controlsHtml =
        '<div class="video-controls">' +
        '<button class="ctrl-btn" id="btnReplay" title="Wiederholen">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>' +
        "</button>" +
        '<button class="ctrl-btn" id="btnPlayPause" title="Play/Pause">' +
        '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>' +
        "</button>" +
        '<button class="ctrl-btn" id="btnMute" title="Ton">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>' +
        "</button>" +
        '<button class="ctrl-btn" id="btnFit" title="Anpassen">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>' +
        "</button>" +
        "</div>";
    }

    return (
      '<header class="hero-section">' +
      heroHtml +
      '<div class="hero-title"><h1>' +
      escapeHtml(data.title || "") +
      "</h1></div>" +
      '<div class="scroll-hint-wrapper">' +
      '<div class="scroll-text">SCROLL</div>' +
      '<div class="scroll-hint-pill"><div class="scroll-dot"></div></div>' +
      "</div>" +
      controlsHtml +
      "</header>" +
      '<div class="info-wrapper">' +
      '<section class="info-section">' +
      '<div class="info-meta">' +
      metaHtml +
      "</div>" +
      '<div class="info-text">' +
      descriptionHtml +
      creditsHtml +
      "</div>" +
      "</section>" +
      "</div>" +
      '<section class="' + gallerySectionClass + '">' +
      (galleryLayout === "grid" ? "" : '<div class="sticky-viewport" id="viewport"><div class="horizontal-track" id="track">') +
      galleryHtml +
      (galleryLayout === "grid" ? "" : "</div></div>") +
      "</section>" +
      '<footer class="footer-nav">' +
      '<div class="nav-block prev" onclick="window.location.href=\'' +
      prevHref.replace(/'/g, "\\'") +
      "'\">" +
      '<div class="nav-label">' +
      escapeHtml(nav.prevLabel || "Zurück") +
      "</div>" +
      '<div class="nav-title">' +
      escapeHtml(prevTitle) +
      "</div>" +
      "</div>" +
      '<div class="nav-block next" onclick="window.location.href=\'' +
      nextHref.replace(/'/g, "\\'") +
      "'\">" +
      '<div class="nav-label">' +
      escapeHtml(nav.nextLabel || "Nächstes Projekt") +
      "</div>" +
      '<div class="nav-title">' +
      escapeHtml(nextTitle) +
      "</div>" +
      "</div>" +
      "</footer>"
    );
  }

  function buildPasswordPage(data, basePath) {
    var lang = getCurrentLang();
    var title = data.title || "Confidential";
    var msg = lang === 'de'
      ? 'Dieses Projekt ist passwortgeschützt.'
      : 'This project is password protected.';
    var placeholder = lang === 'de' ? 'Passwort eingeben' : 'Enter password';
    var btnText = lang === 'de' ? 'ENTSCHLÜSSELN' : 'UNLOCK';
    var errorMsg = lang === 'de' ? 'Falsches Passwort.' : 'Wrong password.';
    var backText = lang === 'de' ? '← Zurück zur Übersicht' : '← Back to overview';

    return (
      '<div class="password-overlay" id="passwordOverlay">' +
      '<div class="password-box">' +
      '<h2>' + escapeHtml(title) + '</h2>' +
      '<p>' + escapeHtml(msg) + '</p>' +
      '<input type="password" id="passwordInput" placeholder="' + placeholder + '" autofocus />' +
      '<div class="error-msg" id="passwordError"></div>' +
      '<button id="passwordBtn">' + btnText + '</button>' +
      '<br><a class="btn-back" href="../index.html#work">' + backText + '</a>' +
      '</div>' +
      '</div>'
    );
  }

  function showError(message) {
    var root = document.getElementById("project-content");
    if (root) {
      root.innerHTML =
        '<div class="project-error" style="padding:4rem;text-align:center;font-family:sans-serif;">' +
        "<p>" +
        escapeHtml(message) +
        "</p>" +
        '<p><a href="index.html#work">Zurück zur Übersicht</a></p>' +
        "</div>";
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    var id = getProjectId();
    if (!id) {
      showError("Kein Projekt angegeben. URL: project.html?id=project_01");
      return;
    }

    var basePath = "/projects/" + id;
    var jsonUrl = basePath + "/project.json";

    console.log("Loading project:", jsonUrl);
    fetch(jsonUrl)
      .then(function (r) {
        console.log("Fetch response:", r.status, r.statusText);
        if (!r.ok) throw new Error("HTTP " + r.status + ": " + r.statusText + " - " + jsonUrl);
        return r.text();
      })
      .then(function (text) {
        console.log("JSON received, parsing...");
        try {
          return JSON.parse(text);
        } catch (e) {
          console.error("JSON parse error:", e);
          console.error("JSON text:", text.substring(0, 500));
          throw new Error("JSON-Syntaxfehler: " + e.message);
        }
      })
      .then(function (data) {
        console.log("Project data loaded:", data.title);
        document.title = (data.title || id) + " | Timo Böse";
        var root = document.getElementById("project-content");
        if (!root) {
          console.error("project-content element not found!");
          return;
        }
        root.innerHTML = buildPage(data, basePath);

        // Passwort-Logik initialisieren
        if (data.passwordProtected) {
          initPasswordProtection(data);
        } else {
          if (window.initProjectPage) window.initProjectPage();
        }
      })
      .catch(function (err) {
        console.error("Project load error:", err);
        showError("Projekt konnte nicht geladen werden: " + id + "<br><small>" + err.message + "</small>");
      });
  });

  function initPasswordProtection(data) {
    var overlay = document.getElementById('passwordOverlay');
    var input = document.getElementById('passwordInput');
    var btn = document.getElementById('passwordBtn');
    var error = document.getElementById('passwordError');

    function checkPassword() {
      var pw = input ? input.value : '';
      // Das Passwort kann in project.json oder als Fallback definiert werden
      var correctPw = data.password || 'lufthansa2024';
      if (pw === correctPw) {
        if (overlay) overlay.style.display = 'none';
        if (window.initProjectPage) window.initProjectPage();
      } else {
        if (error) error.textContent = getCurrentLang() === 'de' ? 'Falsches Passwort.' : 'Wrong password.';
        if (input) {
          input.value = '';
          input.focus();
        }
      }
    }

    if (btn) btn.addEventListener('click', checkPassword);
    if (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') checkPassword();
      });
    }
  }

  setTimeout(function() {
    var root = document.getElementById("project-content");
    if (root && root.innerHTML.trim() === "") {
      console.warn("Project content empty after 5s — showing fallback");
      showError("Projekt lädt nicht. Bitte Seite neu laden.");
    }
  }, 5000);
})();
</script>

<script>
/**
 * project.js – inline, kein Cache-Problem
 */
(function () {
  'use strict';

  window.initProjectPage = function () {
    console.log('🎬 initProjectPage');

    const video = document.getElementById('mainVideo');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnReplay = document.getElementById('btnReplay');
    const btnMute = document.getElementById('btnMute');
    const btnFit = document.getElementById('btnFit');

    if (video && btnPlayPause) {
      btnPlayPause.addEventListener('click', function () {
        if (video.paused) {
          video.play();
          btnPlayPause.querySelector('svg').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        } else {
          video.pause();
          btnPlayPause.querySelector('svg').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        }
      });
    }

    if (video && btnReplay) {
      btnReplay.addEventListener('click', function () {
        video.currentTime = 0;
        video.play();
      });
    }

    if (video && btnMute) {
      btnMute.addEventListener('click', function () {
        video.muted = !video.muted;
        btnMute.classList.toggle('muted', video.muted);
      });
    }

    if (video && btnFit) {
      btnFit.addEventListener('click', function () {
        video.style.objectFit = video.style.objectFit === 'contain' ? 'cover' : 'contain';
        btnFit.classList.toggle('fit-contain');
      });
    }

    const scrollHint = document.querySelector('.hero-section .scroll-hint-wrapper');
    if (scrollHint) {
      // Beim ersten Scroll ausblenden
      var hideHint = function() {
        scrollHint.style.opacity = '0';
        window.removeEventListener('scroll', hideHint);
        window.removeEventListener('wheel', hideHint);
        window.removeEventListener('touchmove', hideHint);
      };
      window.addEventListener('scroll', hideHint, { passive: true });
      window.addEventListener('wheel', hideHint, { passive: true });
      window.addEventListener('touchmove', hideHint, { passive: true });
    }

    // === HORIZONTAL SCROLL GALLERY ===
    const track = document.getElementById('track');
    const viewport = document.getElementById('viewport');

    if (track && viewport) {
      // Drag-to-scroll (manuell)
      let isDown = false;
      let startX;
      let scrollLeft;

      viewport.addEventListener('mousedown', function (e) {
        isDown = true;
        viewport.classList.add('active');
        startX = e.pageX - viewport.offsetLeft;
        scrollLeft = viewport.scrollLeft;
      });

      viewport.addEventListener('mouseleave', function () {
        isDown = false;
        viewport.classList.remove('active');
      });

      viewport.addEventListener('mouseup', function () {
        isDown = false;
        viewport.classList.remove('active');
      });

      viewport.addEventListener('mousemove', function (e) {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - viewport.offsetLeft;
        const walk = (x - startX) * 1.5;
        viewport.scrollLeft = scrollLeft - walk;
      });

      viewport.addEventListener('touchstart', function (e) {
        startX = e.touches[0].pageX - viewport.offsetLeft;
        scrollLeft = viewport.scrollLeft;
      }, { passive: true });

      viewport.addEventListener('touchmove', function (e) {
        const x = e.touches[0].pageX - viewport.offsetLeft;
        const walk = (x - startX) * 1.5;
        viewport.scrollLeft = scrollLeft - walk;
      }, { passive: true });

      // Automatischer horizontaler Scroll beim vertikalen Scrollen
      var scrollContainer = document.querySelector('.horizontal-scroll-container');
      if (scrollContainer) {
        // offsetTop erst beim ersten Scroll-Event berechnen (nach Render)
        var cachedOffsetTop = null;
        window.addEventListener('scroll', function() {
          // offsetTop nach dem ersten Render cachen
          if (cachedOffsetTop === null) {
            cachedOffsetTop = scrollContainer.offsetTop;
          }
          var viewHeight = window.innerHeight;
          var offsetTop = cachedOffsetTop;
          var scrollY = window.scrollY;
          var distance = scrollY - offsetTop;
          var maxScroll = scrollContainer.offsetHeight - viewHeight;
          var windowWidth = window.innerWidth;

          if (distance >= 0) {
            var trackWidth = track.scrollWidth;
            var maxTranslate = Math.max(0, trackWidth - windowWidth + 100);
            // 3x längere Scroll-Strecke für langsamere Bewegung
            var progress = distance / (maxScroll * 3);
            // Ease-Out für sanftes Abbremsen am Ende
            var eased = 1 - Math.pow(1 - Math.min(progress, 1), 2);
            var move = eased * maxTranslate;
            track.style.transform = 'translateX(-' + move + 'px)';
          }

          // Background-Color-Übergang
          if (distance >= 0 && distance <= maxScroll) {
            var progress = distance / maxScroll;
            var startColor = 245;
            var endColor = 187;
            var currentColor = Math.round(startColor - (progress * (startColor - endColor)));
            scrollContainer.style.backgroundColor = 'rgb(' + currentColor + ', ' + currentColor + ', ' + currentColor + ')';
          }
        });
      }
    }

    const loader = document.getElementById('mainLoader');
    if (loader && video) {
      video.addEventListener('loadeddata', function () {
        loader.style.opacity = '0';
        setTimeout(function () { loader.style.display = 'none'; }, 500);
        video.classList.add('loaded');
      });
    }

    // === TEXT ANIMATION SICHTBAR MACHEN ===
    // .info-text p und .credits-list sichtbar machen
    setTimeout(function() {
      var textPs = document.querySelectorAll('.info-text p');
      textPs.forEach(function(p) { p.classList.add('visible'); });
      var credits = document.querySelector('.credits-list');
      if (credits) credits.classList.add('visible');
    }, 300);

    // Bilderschutz: Rechtsklick + Drag auf img/video verhindern
    document.querySelectorAll('img, video').forEach(function(el) {
      el.setAttribute('draggable', 'false');
      el.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    });

    console.log('✅ Project page initialized');
  };

})();
</script>
