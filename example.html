<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- CORE --- */
        :root { --c-bg: #f5f5f5; --c-dark: #0c0c0c; --c-accent: #ff3333; --font-main: 'Inter', sans-serif; --font-head: 'Montserrat', sans-serif; --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--c-bg); color: var(--c-dark); font-family: var(--font-main); overflow-x: hidden; }
        body.locked { overflow: hidden; }

        /* --- UI LAYER --- */
        .ui-layer { position: fixed; top: 40px; right: 40px; z-index: 100; }
        .btn-close { width: 100px; height: 100px; border-radius: 50%; background: rgba(0, 0, 0, 0.15); backdrop-filter: blur(10px); border: 0px solid var(--c-accent); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .btn-close svg { width: 32px; height: 32px; stroke: #fff; stroke-width: 1.5; transition: stroke 0.3s ease, transform 0.3s ease; }
        .btn-close:hover { border-width: 2px; background: rgba(0, 0, 0, 0.3); box-shadow: none; }
        .btn-close:hover svg { stroke: var(--c-accent); transform: scale(1.15); }

        /* --- LOGIN OVERLAY --- */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
        .login-box { max-width: 400px; width: 100%; padding: 40px; }
        .lock-icon { width: 40px; height: 40px; stroke: var(--c-accent); margin-bottom: 20px; }
        .login-title { font-family: var(--font-head); font-size: 1.5rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .login-desc { font-family: var(--font-main); font-size: 0.9rem; color: #aaa; margin-bottom: 30px; }
        .login-input { width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; margin-bottom: 10px; font-family: var(--font-main); text-align: center; outline: none; transition: border 0.3s; }
        .login-input:focus { border-color: var(--c-accent); }
        .btn-login { background: var(--c-accent); color: #fff; border: none; padding: 15px 40px; font-family: var(--font-head); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn-login:hover { background: #d42222; }
        .access-denied { color: var(--c-accent); font-size: 0.8rem; margin-top: 15px; opacity: 0; transition: opacity 0.3s; }

        /* --- HERO SECTION --- */
        .hero-section { position: relative; width: 100%; height: 100vh; background: #000; overflow: hidden; }
        .hero-media-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .hero-video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.8s ease; }
        .hero-video.loaded { opacity: 1; }
        .hero-video.fit-screen { object-fit: contain; background: #262626; }
        .youtube-iframe { width: 100%; height: 100%; border: none; }
        .youtube-placeholder { width: 100%; height: 100%; background-size: cover; background-position: center; position: absolute; top: 0; left: 0; z-index: 2; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .yt-play-btn { width: 80px; height: 80px; background: rgba(255,33,33,0.9); border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: transform 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .youtube-placeholder:hover .yt-play-btn { transform: scale(1.1); background: #ff3333; }
        .yt-play-btn svg { width: 30px; height: 30px; fill: #fff; margin-left: 4px; }
        .hero-title { position: absolute; top: 140px; left: 60px; z-index: 10; pointer-events: none; }
        .hero-title h1 { font-family: var(--font-head); font-weight: 300; font-size: clamp(2.5rem, 5vw, 4.5rem); color: #fff; line-height: 1.1; letter-spacing: -0.02em; text-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .video-controls { position: absolute; bottom: 40px; right: 40px; z-index: 20; display: flex; gap: 15px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); padding: 15px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); }
        .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 50%; transition: all 0.2s; }
        .ctrl-btn:hover { background: rgba(255,255,255,0.2); color: var(--c-accent); }
        .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; stroke: currentColor; stroke-width: 1.5; }
        #btnPlayPause svg { fill: currentColor; stroke: none; } #btnReplay svg { fill: none; }
        .scroll-hint-wrapper { position: absolute; bottom: 40px; left: 60px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .scroll-text { font-family: var(--font-main); font-size: 10px; letter-spacing: 0.2em; color: #fff; opacity: 0; animation: textFade 5s ease-in-out infinite; }
        .scroll-hint-pill { width: 30px; height: 50px; border: 2px solid rgba(255,255,255,0.4); border-radius: 20px; display: flex; justify-content: center; padding-top: 8px; }
        .scroll-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: scrollDot 2s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
        @keyframes scrollDot { 0% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(15px); opacity: 0; } 100% { transform: translateY(0); opacity: 0; } }
        @keyframes textFade { 0%, 80% { opacity: 0; transform: translateY(5px); } 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-5px); } }

        /* --- INFO SECTION --- */
        .info-section { background-color: var(--c-bg); padding: 120px 60px 40px 60px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 80px; max-width: 1800px; margin: 0 auto; position: relative; z-index: 2; }
        .info-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; font-size: 0.95rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; height: fit-content; }
        .meta-block strong { display: block; color: var(--c-dark); margin-bottom: 8px; font-weight: 600; }
        .info-text p { font-size: 1.25rem; line-height: 1.7; margin-bottom: 25px; color: #333; font-weight: 300; opacity: 0; transform: translateY(30px); transition: all 0.8s var(--ease-out); }
        .info-text p.visible { opacity: 1; transform: translateY(0); }
        .credits-list { margin-top: 80px; font-size: 0.9rem; color: #555; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 60px; border-top: 1px solid #ddd; padding-top: 40px; opacity: 0; transform: translateY(30px); transition: all 0.8s var(--ease-out); }
        .credits-list.visible { opacity: 1; transform: translateY(0); }
        .credit-item { display: flex; flex-direction: column; }
        .credit-role { font-weight: 600; color: #000; margin-bottom: 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }

        /* --- HORIZONTAL SCROLL GALLERY --- */
        .horizontal-scroll-container { height: 400vh; position: relative; background-color: #f5f5f5; transition: background-color 0.1s linear; margin-top: -160px; z-index: 1; }
        .horizontal-scroll-container::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.5; z-index: 0; mix-blend-mode: overlay; filter: url('#cloud-noise'); }
        .sticky-viewport { position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; align-items: center; }
        
        .horizontal-track { display: flex; gap: 2px; padding-left: 60px; will-change: transform; position: relative; z-index: 2; width: fit-content; height: 70vh; /* Track hat die Höhe */ }
        
        /* UPDATE: FIX FÜR ASPECT RATIOS */
        .gallery-item {
            height: 100%; /* Nimmt die 70vh des Tracks an */
            width: auto;  /* WICHTIG: Breite passt sich dem Inhalt an */
            flex-shrink: 0; 
            position: relative;
            /* background: #e0e0e0; Vorerst entfernt, um Ränder zu vermeiden */
            display: flex; /* WICHTIG damit das IMG die Breite diktiert */
        }
        
        .gallery-item img, .gallery-item video {
            height: 100%; /* Volle Höhe */
            width: auto;  /* WICHTIG: Breite basierend auf Aspect Ratio */
            object-fit: contain; /* Zeige alles, nichts abschneiden */
            display: block;
        }
        /* Spezifisch für Video-Container, falls nötig */
        .gallery-item.video-item { width: 50vw; }
        .gallery-item.video-item video { width: 100%; object-fit: cover; }


        .asset-caption { position: absolute; bottom: -35px; left: 0; font-size: 0.9rem; color: #777; font-weight: 300; }

        /* --- FOOTER NAV --- */
        .footer-nav { display: flex; height: 33vh; border-top: 1px solid #ccc; background-color: #d6d6d6; position: relative; z-index: 5; margin-top: -25vh; }
        .nav-block { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: background 0.3s, flex 0.5s ease; background: #fff; position: relative; overflow: hidden; }
        .nav-block:hover { background: #f0f0f0; flex: 1.2; }
        .nav-block:first-child { border-right: 1px solid #ddd; }
        .nav-label { font-size: 0.9rem; color: var(--c-accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 15px; }
        .nav-title { font-family: var(--font-head); font-weight: 300; font-size: 2.5rem; color: var(--c-dark); }

        @media(max-width: 900px) {
            .hero-title { top: 100px; left: 30px; }
            .info-section { grid-template-columns: 1fr; padding: 80px 30px; }
            .credits-list { grid-template-columns: 1fr; }
            .btn-close { width: 70px; height: 70px; top: 20px; right: 20px; }
            .gallery-item { height: 50vh; }
            .footer-nav { flex-direction: column; height: auto; margin-top: 0; }
            .nav-block { height: 25vh; border-right: none; border-bottom: 1px solid #ddd; }
            .horizontal-track { height: 50vh; }
        }
    </style>
</head>
<body>

    <script src="js/data.js"></script>

    <svg style="width:0;height:0;position:absolute;"><filter id="cloud-noise"><feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter></svg>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <div class="login-title">Confidential Project</div>
            <div class="login-desc">This project is protected. Please enter credentials to view.</div>
            <input type="text" class="login-input" placeholder="Username" id="userIn">
            <input type="password" class="login-input" placeholder="Password" id="passIn">
            <button class="btn-login" id="btnLogin">Access Project</button>
            <div class="access-denied" id="loginMsg">Access Denied: Invalid Credentials</div>
        </div>
    </div>

    <div class="ui-layer">
        <a href="work.html" class="btn-close" title="Close Project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
    </div>

    <header class="hero-section">
        <div class="hero-media-container" id="heroContainer"></div>
        <div class="hero-title"><h1 id="p-title"></h1></div>
        <div class="scroll-hint-wrapper" id="scrollHint"><div class="scroll-text">SCROLL</div><div class="scroll-hint-pill"><div class="scroll-dot"></div></div></div>
        <div class="video-controls" id="videoControls">
            <button class="ctrl-btn" id="btnReplay"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></button>
            <button class="ctrl-btn" id="btnPlayPause"><svg id="iconPause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
            <button class="ctrl-btn" id="btnMute"><svg id="iconVol" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></button>
            <button class="ctrl-btn" id="btnFit"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
        </div>
    </header>

    <section class="info-section">
        <div class="info-meta">
            <div class="meta-block"><strong>Client</strong> <span id="p-client"></span></div>
            <div class="meta-block"><strong>Role</strong> <span id="p-role"></span></div>
            <div class="meta-block"><strong>Year</strong> <span id="p-year"></span></div>
            <div class="meta-block"><strong>Agency</strong> <span id="p-agency"></span></div>
        </div>
        <div class="info-text" id="p-description"></div>
    </section>

    <section class="horizontal-scroll-container">
        <div class="sticky-viewport">
            <div class="horizontal-track" id="track"></div>
        </div>
    </section>

    <footer class="footer-nav">
        <div class="nav-block prev" onclick="window.history.back()">
            <div class="nav-label">Back</div>
            <div class="nav-title">Overview</div>
        </div>
        <div class="nav-block next" id="btnNextProject">
            <div class="nav-label">Next Project</div>
            <div class="nav-title" id="p-nextTitle"></div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id') || 'pro7'; 
            
            if (typeof projectData === 'undefined') { console.error("data.js not loaded!"); return; }
            const data = projectData[projectId];
            if(!data) { alert("Project not found: " + projectId); return; }

            // POPULATE CONTENT (Hero, Info, Credits) - same as before
            document.getElementById('p-title').textContent = data.title;
            document.getElementById('p-client').textContent = data.client;
            document.getElementById('p-role').textContent = data.role;
            document.getElementById('p-year').textContent = data.year;
            document.getElementById('p-agency').textContent = data.agency;
            const descContainer = document.getElementById('p-description');
            data.description.forEach(text => { const p = document.createElement('p'); p.className = 'anim-text'; p.textContent = text; descContainer.appendChild(p); });
            if(data.credits) { const cList = document.createElement('div'); cList.className = 'credits-list anim-text'; data.credits.forEach(cred => { cList.innerHTML += `<div class="credit-item"><span class="credit-role">${cred.role}</span>${cred.name}</div>`; }); descContainer.appendChild(cList); }

            // --- GALLERY BUILDER (FIXED for Aspect Ratios) ---
            const track = document.getElementById('track');
            data.gallery.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                
                let content = '';
                if(item.type === 'image') {
                    // Für Bilder: Keine feste Breite am Container, das IMG bestimmt die Breite
                    content = `<img src="${item.file}" alt="${item.caption}">`;
                } else if(item.type === 'video') {
                    // Für Videos: Wir brauchen eine Klasse für die feste Breite
                    div.classList.add('video-item');
                    content = `<video autoplay muted loop playsinline src="${item.file}"></video>`;
                }
                div.innerHTML = `${content}<div class="asset-caption">${item.caption}</div>`;
                track.appendChild(div);
            });

            // HERO MEDIA LOGIC (Confidential/YouTube/Local) - same as before
            const heroContainer = document.getElementById('heroContainer');
            const controls = document.getElementById('videoControls');
            let mainVideoElement = null;
            if (data.isConfidential) {
                document.body.classList.add('locked');
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('scrollHint').style.display = 'none';
                controls.style.display = 'none';
                heroContainer.innerHTML = `<video class="hero-video loaded" autoplay muted loop playsinline style="filter: blur(20px); transform: scale(1.1);"><source src="${data.video}" type="video/mp4"></video>`;
                document.getElementById('btnLogin').onclick = () => { document.getElementById('loginMsg').style.opacity = '1'; };
            } else if (data.youtubeId) {
                controls.style.display = 'none';
                heroContainer.innerHTML = `<div class="youtube-placeholder" id="ytPlaceholder" style="background-image: url('${data.heroImage}');"><div class="yt-play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div><div id="ytContainer" style="display:none; width:100%; height:100%;"></div>`;
                document.getElementById('ytPlaceholder').onclick = function() { this.style.display = 'none'; const ytContainer = document.getElementById('ytContainer'); ytContainer.style.display = 'block'; ytContainer.innerHTML = `<iframe class="youtube-iframe" src="https://www.youtube.com/embed/${data.youtubeId}?autoplay=1&rel=0&modestbranding=1&controls=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; };
            } else {
                heroContainer.innerHTML = `<video class="hero-video" id="realVideo" autoplay muted loop playsinline><source src="${data.video}" type="video/mp4"></video>`;
                mainVideoElement = document.getElementById('realVideo');
                mainVideoElement.addEventListener('canplay', () => mainVideoElement.classList.add('loaded'));
                if (mainVideoElement.readyState >= 3) mainVideoElement.classList.add('loaded');
                bindVideoControls(mainVideoElement);
            }

            function bindVideoControls(vid) {
               // (Controls logic same as before)
               const btnPlay = document.getElementById('btnPlayPause'); const btnMute = document.getElementById('btnMute'); const btnReplay = document.getElementById('btnReplay'); const btnFit = document.getElementById('btnFit');
               const svgPlay = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>'; const svgPause = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'; const svgMute = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'; const svgSound = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>'; const svgFit = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>'; const svgFill = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
               btnPlay.onclick = () => { if(vid.paused){vid.play(); btnPlay.innerHTML=svgPause} else{vid.pause(); btnPlay.innerHTML=svgPlay} };
               btnMute.onclick = () => { if(vid.muted){vid.muted=false; btnMute.innerHTML=svgSound} else{vid.muted=true; btnMute.innerHTML=svgMute} };
               btnReplay.onclick = () => { vid.currentTime=0; vid.play(); btnPlay.innerHTML=svgPause };
               btnFit.onclick = () => { vid.classList.toggle('fit-screen'); btnFit.innerHTML=vid.classList.contains('fit-screen')?svgFill:svgFit; };
            }
            const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); }); }, { threshold: 0.1 });
            setTimeout(() => { document.querySelectorAll('.anim-text').forEach(el => observer.observe(el)); }, 100);
            document.getElementById('p-nextTitle').textContent = data.nextProjectTitle;
            document.getElementById('btnNextProject').onclick = () => window.location.href = `project.html?id=${data.nextProjectLink}`;

            // --- SCROLL LOGIC (VEREINFACHT & REPARIERT) ---
            const trackContainer = document.querySelector('.horizontal-scroll-container');
            const bgContainer = document.querySelector('.horizontal-scroll-container');
            
            // WICHTIG: Wir müssen warten, bis die Bilder geladen sind, um die korrekte Breite zu kennen.
            // Ein simpler Timeout hilft hier, aber sauberer wäre ein ImagesLoaded Check. 
            // Für jetzt sollte das reichen, da die Bilder im Viewport sind.
            
            window.addEventListener('scroll', () => {
                const viewHeight = window.innerHeight;
                const offsetTop = trackContainer.offsetTop;
                const scrollY = window.scrollY;
                const distance = scrollY - offsetTop;
                const maxScroll = trackContainer.offsetHeight - viewHeight;
                const windowWidth = window.innerWidth;

                // 1. Berechne die TATSÄCHLICHE Breite des Tracks (jetzt wo CSS stimmt)
                const trackWidth = track.scrollWidth;
                
                // 2. Das Ziel: Der Track soll sich so weit nach links schieben, 
                // dass sein rechtes Ende genau am rechten Bildschirmrand ankommt.
                // Bewegungs-Weg = Gesamtbreite - Bildschirmbreite.
                // Wir addieren einen kleinen Puffer (z.B. 100px), damit es nicht so gequetscht aussieht.
                let maxTranslate = trackWidth - windowWidth + 100;
                
                // Sicherstellen, dass wir nicht negativ werden, falls wenig Bilder da sind.
                maxTranslate = Math.max(0, maxTranslate);

                if (distance >= 0) {
                    let progress = distance / maxScroll;
                    // Wir lassen den Progress etwas über 1 hinausgehen, damit der Footer-Übergang smooth ist
                    let move = progress * maxTranslate;
                    track.style.transform = `translateX(-${move}px)`;
                }

                // Gradient Logic (bleibt gleich)
                if (distance >= 0 && distance <= maxScroll) {
                    let progress = distance / maxScroll;
                    const startColor = 245; const endColor = 187; 
                    const currentColor = Math.round(startColor - (progress * (startColor - endColor)));
                    bgContainer.style.backgroundColor = `rgb(${currentColor}, ${currentColor}, ${currentColor})`;
                }
            });
        });
    </script>
</body>
</html>
